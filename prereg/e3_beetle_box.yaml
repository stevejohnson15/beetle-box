# FROZEN pre-registration for E3 (the beetle-box, Philosophical Investigations §293).
# Hypotheses, conditions, and thresholds fixed BEFORE running (plan §3.2, §3.3).
# Analysis imports only these criteria. Do not tune to a result.

experiment: e3_beetle_box
frozen: true
version: 2
date: 2026-07-26
# v2 (2026-07-26): corrected the private_referent design. v1 handed the receiver its
# own box for the target and asked it to classify the referent; because that box
# encodes the referent, the receiver read its own box and ignored the message (a
# receiver-side leak -- no communication; see docs/e3_design.md). v2 reformulates
# private_referent as a discrimination game (receiver sees all candidate boxes and
# must use the message to pick the target) and adds channel_ablation() as a
# permanent no-leak guard. Thresholds and hypotheses are UNCHANGED; only the game
# mechanics were fixed. v1 private_referent numbers are void.

target: >
  §293 directly. A population coordinates on "inner states" through public words
  while we control the boxes. The question is whether — and how much — the private
  contents of the box do any work in the public language-game.

games:  # all three are supported (a framework for exploration); see docs/e3_design.md
  - private_referent:   the sender's only access to the referent is its box; the
      receiver must identify it from ALL candidate boxes using the public message
      (discrimination game -> message is load-bearing, no leak). The centerpiece.
  - sensation_matching: two agents privately sense a type, exchange public words,
      and jointly judge same/different.
  - public_referent_aux: referent public to the sender, box an auxiliary channel
      to the sender only; receiver decodes the message (weakest wiring; contrast).

conditions: [shared, divergent, empty, noise]

hypotheses:
  H_earnable: >
    The cancellation must be EARNABLE (§3.3). Where the box is the only route to
    the answer (private_referent, sensation_matching), informative boxes
    (shared/divergent) must beat empty/noise by >= earnable_margin. Otherwise the
    box is architecturally idle and any "it cancels out" is rigged, not found.
  H_drops_out: >
    If shared and divergent coordinate about equally (|acc(shared) - acc(divergent)|
    <= drop_gap_tolerance), the private FORM of the inner state is idle — a working
    model of "the beetle drops out."
  H_shared_helps: >
    If a shared inner state coordinates measurably better than divergent
    (acc(shared) - acc(divergent) > drop_gap_tolerance), that is a result against
    the strong deflationary reading — the shared box does work.

thresholds:
  chance_margin: 0.10          # "above chance" means acc >= chance + this
  earnable_margin: 0.25        # informative-mean minus empty, for box-only games
  drop_gap_tolerance: 0.10     # |shared - divergent| below this = beetle drops out

licenses: |
  Makes the core claim of §293 a number. If empty/divergent-box agents coordinate
  as fluently as shared-box agents, this is a working model of the beetle dropping
  out; if a shared inner state measurably improves coordination, that counts
  against the strong deflationary reading. Either way it does NOT settle whether
  the agents "have" inner states, nor what those states are like. The four
  conditions are our God's-eye control; the agents never get one. (plan §4.3)
