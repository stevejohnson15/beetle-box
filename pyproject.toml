[project]
name = "beetlebox"
version = "0.1.0"
description = "Operationalizing Wittgenstein's private-language and rule-following arguments with LLM agents and small from-scratch models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Beetle-Box contributors" }]
keywords = [
    "wittgenstein",
    "emergent-communication",
    "multi-agent",
    "philosophy-of-language",
    "interpretability",
]

dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "hydra-core>=1.3",
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# Tooling for the demonstration notebooks (see docs/README.md).
notebooks = [
    "jupyter>=1.0",
    "nbformat>=5.9",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
    "matplotlib>=3.8",
]

[project.scripts]
beetlebox = "beetlebox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beetlebox"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "experiments", "tests"]
# Notebooks follow their own idioms (trailing `;` to suppress output, compact
# cells); they are verified by executing them, not by linting.
extend-exclude = ["notebooks", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["beetlebox"]
branch = true

[tool.coverage.report]
show_missing = true
# Coverage gate for the full suite (`uv run pytest --cov`). The bar is set below
# the current level to leave headroom; new code is expected to keep it here or higher.
fail_under = 90
# The thin live-API surfaces are exercised by manual/live checks, not unit tests
# (the surrounding logic is unit-tested via dependency injection). Exclude the
# defensive/uninstrumentable lines from the coverage gate.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
