[project]
name = "beetlebox"
version = "0.1.0"
description = "Operationalizing Wittgenstein's private-language and rule-following arguments with LLM agents and small from-scratch models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Beetle-Box contributors" }]
keywords = [
    "wittgenstein",
    "emergent-communication",
    "multi-agent",
    "philosophy-of-language",
    "interpretability",
]

dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "hydra-core>=1.3",
    "anthropic>=0.69",
    # Components extracted from Beetle-Box into standalone Apache-2.0 libraries.
    # Not on PyPI yet -- resolved from sibling checkouts via [tool.uv.sources]
    # below. After they are published, delete that section and these pins resolve
    # from PyPI.
    "reprolog>=0.1",
    "frozenprereg>=0.1",
    "emcomkit>=0.1",
    "agentharness>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# Tooling for the demonstration notebooks (see docs/README.md).
notebooks = [
    "jupyter>=1.0",
    "nbformat>=5.9",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
    "matplotlib>=3.8",
]

[project.scripts]
beetlebox = "beetlebox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beetlebox"]

# The extracted libraries are not on PyPI yet; resolve them from their GitHub
# release tags. After they are published to PyPI, delete this section and the
# version pins above resolve normally. For local co-development of a library,
# swap its line for `{ path = "../<lib>", editable = true }`.
[tool.uv.sources]
reprolog = { git = "https://github.com/stevejohnson15/reprolog", tag = "v0.1.0" }
frozenprereg = { git = "https://github.com/stevejohnson15/frozenprereg", tag = "v0.1.0" }
emcomkit = { git = "https://github.com/stevejohnson15/emcomkit", tag = "v0.1.0" }
agentharness = { git = "https://github.com/stevejohnson15/agentharness", tag = "v0.1.0" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "experiments", "tests"]
# Notebooks follow their own idioms (trailing `;` to suppress output, compact
# cells); they are verified by executing them, not by linting.
extend-exclude = ["notebooks", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["beetlebox"]
branch = true

[tool.coverage.report]
show_missing = true
# Coverage gate for the full suite (`uv run pytest --cov`). The bar is set below
# the current level to leave headroom; new code is expected to keep it here or higher.
fail_under = 90
# The thin live-API surfaces are exercised by manual/live checks, not unit tests
# (the surrounding logic is unit-tested via dependency injection). Exclude the
# defensive/uninstrumentable lines from the coverage gate.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
